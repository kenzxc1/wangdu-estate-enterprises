<!DOCTYPE html>
<html>
<head>
    <title>Font Tag Attributes</title>
</head>
<body>
    <h1>The FONT Tag</h1>
    <font color="red" size="5" face="Arial">This text is red, size 5, Arial font.</font><br><br>
    <font color="blue" size="6" face="Courier New">This text is blue, size 6, Courier New font.</font><br><br>
    <font color="green" size="4" face="Times New Roman">This text is green, size 4, Times New Roman font.</font>
</body>
</html>
